
[project]
name = "policymind-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters",
    "sentence-transformers",
    "chromadb",
    "groq",
    "python-dotenv",
    "fastapi[standard]",
    "torch==2.14.1+cpu",
    "langfuse",
    "pypdf",
]

[dependency-groups]
evaluation = [
    "openai==2.54.0",
    "ragas==0.4.3",
    "matplotlib",
]
dev = [
    "pytest",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
