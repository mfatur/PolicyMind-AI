
name: PolicyMind AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: uv sync --group dev --group evaluation --extra ui

      - name: Run unit tests
        run: uv run python -m pytest app/test_chunking_unit.py app/test_vector_store_unit.py app/test_demo_unit.py app/test_api_cors_unit.py -v
